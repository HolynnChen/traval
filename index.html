<style>
/* ============================================================
   智能门锁 · 锁屏
   ============================================================ */
:root{
  --bg:#f6f4ef; --paper:#ffffff; --ink:#1c1917; --ink2:#57534e; --ink3:#8b857e;
  --line:#e6e1d8; --line2:#d6cfc2;
  --brand:#0f766e; --brand2:#14b8a6; --accent:#c2410c;
  --shadow:0 1px 2px rgba(28,25,23,.06),0 8px 24px -8px rgba(28,25,23,.12);
  --r:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#0e1512;color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ---------- 门厅背景 ---------- */
#lock{
  position:fixed;inset:0;display:grid;place-items:center;padding:20px;
  background:
    radial-gradient(120% 90% at 50% 0%, #1d2b26 0%, #0e1512 55%, #080c0a 100%);
}
#lock::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    repeating-linear-gradient(0deg, rgba(255,255,255,.014) 0 1px, transparent 1px 3px);
}

/* ---------- 锁体 ---------- */
.lock{
  position:relative;width:min(360px,100%);
  background:linear-gradient(168deg,#2b3a35 0%,#1b2622 40%,#141d1a 100%);
  border:1px solid rgba(255,255,255,.09);
  border-radius:26px;
  padding:22px 22px 18px;
  box-shadow:
    0 34px 80px -20px rgba(0,0,0,.85),
    0 0 0 1px rgba(0,0,0,.5),
    inset 0 1px 0 rgba(255,255,255,.09);
  transition:transform .08s;
}
.lock.shake{animation:shake .42s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{
  10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(4px)}
  30%,50%,70%{transform:translateX(-7px)} 40%,60%{transform:translateX(7px)}
}
.lock.ok{box-shadow:0 34px 80px -20px rgba(0,0,0,.85),0 0 0 1px rgba(20,184,166,.55),0 0 46px -6px rgba(20,184,166,.5)}

/* 品牌行 */
.lock-brand{display:flex;align-items:center;gap:9px;margin-bottom:16px}
.lock-brand .dot{
  width:9px;height:9px;border-radius:50%;background:#14b8a6;
  box-shadow:0 0 10px 1px rgba(20,184,166,.9);
  animation:breathe 2.4s ease-in-out infinite;
}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.32}}
.lock-brand .nm{font-size:12.5px;letter-spacing:.16em;color:#7f958d;font-weight:600}
.lock-brand .rt{margin-left:auto;font-size:10.5px;color:#4e605a;letter-spacing:.1em}

/* ---------- 屏幕 ---------- */
.screen{
  background:linear-gradient(180deg,#0a1512,#08110e);
  border:1px solid rgba(20,184,166,.2);
  border-radius:13px;
  padding:14px 15px 13px;
  margin-bottom:17px;
  box-shadow:inset 0 2px 14px rgba(0,0,0,.7);
}
.screen .lbl{font-size:10.5px;letter-spacing:.2em;color:#4e605a;margin-bottom:9px}
.dots{display:flex;gap:11px;height:15px;align-items:center;margin-bottom:11px}
.dots .ph{color:#31443e;font-size:13px;letter-spacing:.28em;user-select:none}
.dots .more{color:#5f7a72;font-size:12px;margin-left:2px}
.dots i{
  width:13px;height:13px;border-radius:50%;
  border:1.6px solid #2c3f39;transition:all .16s;
}
.dots i.on{
  background:#14b8a6;border-color:#14b8a6;
  box-shadow:0 0 11px 1px rgba(20,184,166,.85);
}
.dots.err i{border-color:#b91c1c;background:#7f1d1d;box-shadow:0 0 10px 0 rgba(185,28,28,.7)}
.screen .msg{
  font-size:11.5px;color:#5f7a72;min-height:17px;letter-spacing:.03em;
  font-variant-numeric:tabular-nums;
}
.screen .msg.bad{color:#f87171}
.screen .msg.good{color:#5eead4}
.screen .msg.work{color:#fbbf24}

/* ---------- 键盘 ---------- */
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.key{
  height:52px;border-radius:12px;
  background:linear-gradient(180deg,#31423c,#212e29);
  border:1px solid rgba(255,255,255,.07);
  box-shadow:0 2px 0 rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08);
  color:#dbe7e3;font-size:20px;font-weight:600;
  display:grid;place-items:center;
  transition:transform .06s,filter .06s;
  user-select:none;-webkit-tap-highlight-color:transparent;
}
.key:active,.key.press{transform:translateY(1.5px);filter:brightness(1.35)}
.key.fn{font-size:15px;color:#8fa8a1;background:linear-gradient(180deg,#26332e,#1a2420)}
.key.hash{background:linear-gradient(180deg,#0f766e,#0b5a54);color:#eafffb;font-size:19px}
.key.del{font-size:17px}

/* ---------- 底部 ---------- */
.lock-foot{
  margin-top:15px;padding-top:13px;border-top:1px solid rgba(255,255,255,.07);
  display:flex;align-items:center;gap:8px;font-size:10.5px;color:#4e605a;letter-spacing:.06em;
}
.lock-foot .led{
  width:6px;height:6px;border-radius:50%;background:#33453f;flex:0 0 auto;transition:background .2s;
}
.lock-foot .led.on{background:#14b8a6;box-shadow:0 0 8px rgba(20,184,166,.9)}
.lock-foot .sp{margin-left:auto}

/* ---------- 提示 ---------- */
.hint{
  margin-top:15px;text-align:center;font-size:11.5px;color:#54665f;line-height:1.75;
}
.hint b{color:#8fa8a1;font-weight:600}
.hint .clr{
  color:#6b7f78;text-decoration:underline;text-underline-offset:3px;
  text-decoration-color:#3a4c46;cursor:pointer;
}
.hint .clr:hover{color:#a8bdb6}

/* ---------- 开锁动画 ---------- */
#lock.gone{animation:fade .5s forwards}
@keyframes fade{to{opacity:0;visibility:hidden}}
#app-root{opacity:0;transition:opacity .5s .1s}
#app-root.show{opacity:1}

@media(max-width:400px){
  .lock{padding:18px 17px 15px;border-radius:22px}
  .key{height:46px;font-size:18px}
  .dots{gap:9px}
}

</style>
</head>

    var s1 = document.createElement('script');
    s1.textContent = payload.data;
    document.body.appendChild(s1);

    var s2 = document.createElement('script');
    s2.textContent = payload.app;
    document.body.appendChild(s2);

    // 恢复浅色主题（app.css 已注入，覆盖锁屏的深色 body 样式）
    document.body.style.background = '';
    document.body.style.color = '';
    document.body.style.overflow = 'auto';
    document.documentElement.style.height = 'auto';
    elRoot.classList.add('show');
    document.getElementById('lock').classList.add('gone');
    setTimeout(function(){
      var l = document.getElementById('lock');
      if (l && l.parentNode) l.parentNode.removeChild(l);
    }, 600);
  }

  /* ---------- 状态 ---------- */
  var input = '', busy = false;

  function paint(){
    if (!elDotsWrap) return;
    var n = input.length;
    // 不预留任何空位、不显示总数 —— 只反映「已输入几位」，不泄漏密码长度
    if (n === 0) {
      elDotsWrap.innerHTML = '<span class="ph">— — — —</span>';
    } else {
      var shown = Math.min(n, 14);
      var html = '';
      for (var i=0;i<shown;i++) html += '<i class="on"></i>';
      if (n > 14) html += '<span class="more">×' + n + '</span>';
      elDotsWrap.innerHTML = html;
    }
    elDots = elDotsWrap.children;
  }
  function say(t, cls){
    if (!elMsg) return;
    elMsg.textContent = t;
    elMsg.className = 'msg' + (cls ? ' ' + cls : '');
  }
  function reset(msg){
    input = '';
    paint();
    if (msg) say(msg, 'bad');
  }

  function submit(){
    if (busy || !elDots) return;
    if (input.length < 1) { say('请输入密码', 'bad'); return; }
    busy = true;
    say('正在验证…', 'work');
    elLed.classList.add('on');

    var pw = input;
    deriveKey(pw, SALT)
      .then(function(key){
        return decryptWith(key).then(function(payload){ return { key:key, payload:payload }; });
      })
      .then(function(r){
        // 缓存密钥（非明文密码），下次自动解锁
        return crypto.subtle.exportKey('raw', r.key).then(function(raw){
          try {
            localStorage.setItem(LS_KEY, b64(new Uint8Array(raw)));
            localStorage.setItem(LS_SALT, b64(SALT));
          } catch(e){}
          elLock.classList.add('ok');
          say('验证通过，正在开锁…', 'good');
          setTimeout(function(){ mount(r.payload); }, 320);
        });
      })
      .catch(function(){
        busy = false;
        elLed.classList.remove('on');
        elLock.classList.add('shake');
        elDotsWrap.classList.add('err');
        say('密码错误，请重试', 'bad');
        setTimeout(function(){
          elLock.classList.remove('shake');
          elDotsWrap.classList.remove('err');
          reset();
        }, 620);
      });
  }

  /* ---------- 尝试用缓存密钥自动解锁 ---------- */
  function tryAuto(){
    var k, s;
    try { k = localStorage.getItem(LS_KEY); s = localStorage.getItem(LS_SALT); } catch(e){ return Promise.resolve(false); }
    if (!k || !s) return Promise.resolve(false);

    return crypto.subtle.importKey('raw', unb64(k), { name:'AES-GCM' }, false, ['decrypt'])
      .then(function(key){ return decryptWith(key); })
      .then(function(payload){
        say('已记住本机密码，正在开锁…', 'good');
        elLed.classList.add('on');
        elDotsWrap.innerHTML = '<span class="ph">····</span>';
        elLock.classList.add('ok');
        setTimeout(function(){ mount(payload); }, 260);
        return true;
      })
      .catch(function(){
        try { localStorage.removeItem(LS_KEY); localStorage.removeItem(LS_SALT); } catch(e){}
        return false;
      });
  }

  /* ---------- 构建锁屏 UI ---------- */
  function build(){
    var wrap = document.createElement('div');
    wrap.id = 'lock';
    wrap.innerHTML = [
      '<div class="lock" id="lock-body">',
        '<div class="lock-brand">',
          '<span class="dot"></span>',
          '<span class="nm">SMART LOCK</span>',
          '<span class="rt">MODEL A-6</span>',
        '</div>',
        '<div class="screen">',
          '<div class="lbl">请输入大门密码</div>',
          '<div class="dots" id="dots"></div>',
          '<div class="msg" id="msg">输入密码 · 按 # 确认</div>',
        '</div>',
        '<div class="pad" id="pad">',
          '<button class="key" data-k="1">1</button>',
          '<button class="key" data-k="2">2</button>',
          '<button class="key" data-k="3">3</button>',
          '<button class="key" data-k="4">4</button>',
          '<button class="key" data-k="5">5</button>',
          '<button class="key" data-k="6">6</button>',
          '<button class="key" data-k="7">7</button>',
          '<button class="key" data-k="8">8</button>',
          '<button class="key" data-k="9">9</button>',
          '<button class="key fn del" data-k="del">删除</button>',
          '<button class="key" data-k="0">0</button>',
          '<button class="key hash" data-k="#">#</button>',
        '</div>',
        '<div class="lock-foot">',
          '<span class="led" id="led"></span>',
          '<span id="foot-txt">门锁已锁定</span>',
          '<span class="sp">按 # 结束</span>',
        '</div>',
      '</div>',
      '<div class="hint">',
        '需要大门密码才能查看行程内容<br>',
        '<b>验证通过后本机会记住</b>，下次打开自动解锁',
        '<div style="margin-top:8px"><span class="clr" id="clr">忘记密码？清除本机记录</span></div>',
      '</div>'
    ].join('');
    document.body.appendChild(wrap);

    elLock     = document.getElementById('lock-body');
    elDotsWrap = document.getElementById('dots');
    elDots     = elDotsWrap.children;
    elMsg      = document.getElementById('msg');
    elLed      = document.getElementById('led');
    elRoot     = document.getElementById('app-root');

    document.getElementById('pad').addEventListener('click', function(e){
      var btn = e.target.closest('.key');
      if (!btn || busy) return;
      var k = btn.dataset.k;
      btn.classList.add('press');
      setTimeout(function(){ btn.classList.remove('press'); }, 90);

      if (k === 'del') {
        input = input.slice(0, -1);
        if (elMsg.classList.contains('bad')) say('输入密码 · 按 # 确认');
        paint();
        return;
      }
      if (k === '#') { submit(); return; }
      if (input.length >= 32) return;   // 宽松上限，不暗示真实长度
      input += k;
      paint();
    });

    document.getElementById('clr').addEventListener('click', function(){
      try { localStorage.removeItem(LS_KEY); localStorage.removeItem(LS_SALT); } catch(e){}
      reset('已清除本机记录，请重新输入');
    });

    // 物理键盘也支持
    document.addEventListener('keydown', function(e){
      if (busy || !elDots) return;
      if (e.key >= '0' && e.key <= '9') {
        if (input.length < 32) { input += e.key; paint(); }
      } else if (e.key === '#') {
        e.preventDefault();
        submit();
      } else if (e.key === 'Backspace') {
        e.preventDefault();
        input = input.slice(0,-1); paint();
      } else if (e.key === 'Enter') {
        submit();
      }
    });
  }

  /* ---------- 启动 ---------- */
  function boot(){
    if (!window.crypto || !crypto.subtle) {
      document.body.innerHTML = '<div style="color:#fff;padding:40px;font-size:14px;line-height:2">'
        + '当前浏览器不支持 WebCrypto 解密。<br>请改用 Chrome / Edge / Safari 较新版本，'
        + '或通过 https 访问（file:// 下部分浏览器会限制）。</div>';
      return;
    }
    build();
    elRoot = document.getElementById('app-root');
    tryAuto().then(function(ok){
      if (!ok) {
        // 没缓存 → 停在锁屏
        document.body.style.overflow = 'hidden';
      }
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
